<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .heartbeat-line {
        stroke-dasharray: 260;
        stroke-dashoffset: 260;
        animation: ecgStroke 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .pulse-dot {
        animation: dotGlow 2.2s ease-in-out infinite;
      }
      .badge-glow {
        animation: shieldPulse 3s ease-in-out infinite alternate;
      }
      @keyframes ecgStroke {
        0% { stroke-dashoffset: 260; opacity: 0.3; }
        35% { stroke-dashoffset: 0; opacity: 1; }
        70% { stroke-dashoffset: -260; opacity: 0.8; }
        100% { stroke-dashoffset: -260; opacity: 0.3; }
      }
      @keyframes dotGlow {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.35); opacity: 1; filter: drop-shadow(0 0 8px #60A5FA); }
      }
      @keyframes shieldPulse {
        0% { filter: drop-shadow(0 4px 12px rgba(59, 130, 246, 0.35)); }
        100% { filter: drop-shadow(0 6px 24px rgba(99, 102, 241, 0.75)); }
      }
    </style>
  </defs>

  <!-- Modern Shield / Badge Base with Dynamic Ambient Glow -->
  <g class="badge-glow">
    <rect x="18" y="18" width="164" height="164" rx="44" fill="url(#pulseGradient)" />
    <!-- Inner Glass Ring -->
    <rect x="24" y="24" width="152" height="152" rx="38" stroke="white" stroke-opacity="0.3" stroke-width="2.5" fill="none" />
  </g>

  <!-- Tricolor Accent Top Arc -->
  <path d="M 44 42 Q 100 26 156 42" stroke="#FF9933" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.95" />
  
  <!-- Subtle Grid/Radar Background Lines for Civic Tech Look -->
  <circle cx="100" cy="104" r="42" stroke="white" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 4" fill="none" />
  <circle cx="100" cy="104" r="22" stroke="white" stroke-opacity="0.15" stroke-width="1.5" fill="none" />

  <!-- Ghost Baseline -->
  <path 
    d="M 34 104 L 66 104 L 80 72 L 98 138 L 118 78 L 132 104 L 166 104" 
    stroke="white" 
    stroke-opacity="0.22" 
    stroke-width="6" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Beating EKG Heartbeat Line (Animates Continuously) -->
  <path 
    class="heartbeat-line"
    d="M 34 104 L 66 104 L 80 72 L 98 138 L 118 78 L 132 104 L 166 104" 
    stroke="#FFFFFF" 
    stroke-width="6.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- Active Node Dots in the ECG Beat -->
  <circle cx="80" cy="72" r="5" fill="#93C5FD" class="pulse-dot" />
  <circle cx="98" cy="138" r="6" fill="#34D399" class="pulse-dot" />
  <circle cx="118" cy="78" r="5" fill="#F472B6" class="pulse-dot" />

  <!-- Top Democracy Beacon Dot -->
  <circle cx="100" cy="54" r="6.5" fill="#FFFFFF" />
  <circle cx="100" cy="54" r="13" stroke="#60A5FA" stroke-width="2" stroke-opacity="0.6" fill="none" class="pulse-dot" />

  <!-- Tricolor Accent Bottom Arc -->
  <path d="M 60 166 Q 100 176 140 166" stroke="#138808" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.95" />
</svg>
